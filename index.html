<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0a18" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Kaasu — a local-first portfolio tracker" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Kaasu</title>
    <script>
      // Apply theme before paint to avoid a flash.
      try {
        var t = localStorage.getItem("kaasu.theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
