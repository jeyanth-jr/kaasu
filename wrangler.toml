name = "kaasu-api"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Public, non-secret settings. Secrets (if any) go through `wrangler secret put`.
[vars]
# Your Supabase project URL, e.g. https://abcd1234.supabase.co
SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co"
# Origins allowed to call the API. "*.vercel.app" also covers preview deployments.
ALLOWED_ORIGINS = "http://localhost:5173,https://YOUR-APP.vercel.app"

# Daily AMFI NAV file cache. Create it once:  npx wrangler kv namespace create NAV_KV
# then paste the printed id below.
[[kv_namespaces]]
binding = "NAV_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
