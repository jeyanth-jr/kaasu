name = "kaasu"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Keep variables you set in the Cloudflare dashboard (Settings → Variables and Secrets)
# instead of overwriting them on every deploy. Set these two there, once:
#
#   SUPABASE_URL     = https://<your-project-ref>.supabase.co
#   ALLOWED_ORIGINS  = https://<your-app>.vercel.app          (comma-separated; "*.vercel.app" also allows previews)
#
# Legacy HS256 Supabase projects also need the secret SUPABASE_JWT_SECRET.
keep_vars = true

# Shared rate limit across all Worker instances (the in-memory limiter only sees one instance).
# Two keys are used: the caller's IP before sign-in is checked, then the signed-in user.
# Workers Rate Limiting works on workers.dev; WAF rate-limit rules would need your own domain.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 120
  period = 60

# Optional: cache the daily AMFI NAV file in KV so each new Worker instance doesn't re-download it.
# Without it the Worker still works (it keeps the file in memory per instance).
# To enable: npx wrangler kv namespace create NAV_KV, then uncomment with the printed id.
#
# [[kv_namespaces]]
# binding = "NAV_KV"
# id = "<id printed by the command above>"
